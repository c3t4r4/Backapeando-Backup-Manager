services:
  # PostgreSQL database
  postgres:
    image: postgres:18-alpine
    container_name: backapeando-postgres
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_DB: ${PG_DBNAME}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      PORT: ${PG_PORT}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=pt_BR.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/18/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DBNAME} -h localhost -p ${PG_PORT}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # Backend API
  api:
    build:
      context: ./backend
      dockerfile: cmd/api/Dockerfile
    container_name: backapeando-api
    environment:
      DATABASE_URL: "postgres://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:${PG_PORT}/${PG_DBNAME}?sslmode=disable"
      MASTER_ENCRYPTION_KEY: "${MASTER_ENCRYPTION_KEY}"
      HTTP_ADDR: ":8081"
      SECURE_COOKIES: "false" # dev only
      REDIS_URL: "redis://redis:6379"
      REDIS_DB: "0"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8081/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - internal
    # volumes:
    #   - ./backend:/app:cached  # live reload in development (with entr or similar) — comentado para build correto em Docker
    restart: unless-stopped

  # Backup scheduler worker (polls backup_runs / servers, executes backups)
  worker:
    build:
      context: ./backend
      dockerfile: cmd/worker/Dockerfile
    container_name: backapeando-worker
    environment:
      DATABASE_URL: "postgres://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:${PG_PORT}/${PG_DBNAME}?sslmode=disable"
      MASTER_ENCRYPTION_KEY: "${MASTER_ENCRYPTION_KEY}"
      SECURE_COOKIES: "false" # unused by the worker, but config.Load() requires it to be set
      MAX_CONCURRENT_BACKUPS: "3"
      SCHEDULER_POLL_INTERVAL: "30"
      GRACEFUL_SHUTDOWN_TIMEOUT: "300"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  # Frontend (Nginx)
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: backapeando-web
    ports:
      - "3000:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - internal
    restart: unless-stopped

  # Redis (for rate limiting)
  redis:
    image: redis:7-alpine
    container_name: backapeando-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
