name: Deploy Arquitetura Diagram to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - docs/arquitetura.html
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate diagram screenshot
        run: |
          # Create isolated temp directory for Puppeteer installation
          TMPDIR=$(mktemp -d)
          cd "$TMPDIR"

          npm init -y
          npm install puppeteer@25.11.0

          # Create screenshot script
          cat > screenshot.mjs << 'EOFJS'
          import puppeteer from 'puppeteer';

          (async () => {
            const browser = await puppeteer.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox'],
            });

            const page = await browser.newPage();
            await page.setViewport({ width: 1600, height: 1200, deviceScaleFactor: 2 });

            const filePath = `file://${process.env.GITHUB_WORKSPACE}/docs/arquitetura.html`;
            console.log(`Loading: ${filePath}`);

            await page.goto(filePath, { waitUntil: 'networkidle0' });
            console.log('Page loaded, taking screenshot...');

            await page.screenshot({
              path: `${process.env.GITHUB_WORKSPACE}/docs/arquitetura.png`,
              fullPage: true,
            });

            await browser.close();
            console.log('Screenshot saved to docs/arquitetura.png');
          })().catch(err => {
            console.error('Error:', err);
            process.exit(1);
          });
          EOFJS

          node screenshot.mjs

      - name: Commit generated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/arquitetura.png

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: regenerar docs/arquitetura.png [skip ci]"
            git push origin HEAD:main
          fi

      - name: Prepare GitHub Pages artifact
        run: |
          mkdir -p _site
          cp docs/arquitetura.html _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
