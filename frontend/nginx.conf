# Nginx configuration for Vue 3 SPA + API proxy
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;
    gzip_min_length 1000;

    # Docker embedded DNS (Compose bridge and Swarm overlay networks).
    # Community Nginx resolves an `upstream {}` host once at startup and never
    # re-resolves it — if the `api` container is recreated (new IP), Nginx keeps
    # proxying to the stale IP until it is itself restarted. Using $variable in
    # proxy_pass forces per-request resolution against this resolver instead.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name _;

        # Health check endpoint (for Docker health, Traefik probes)
        location / {
            root /usr/share/nginx/html;

            # SPA routing: fallback to index.html for client-side routing
            # Match files/dirs that don't exist → serve index.html
            try_files $uri $uri/ /index.html;

            # Cache control
            # For index.html: no cache (always fresh)
            location = /index.html {
                add_header Cache-Control "public, max-age=0, must-revalidate" always;
                add_header X-Frame-Options "SAMEORIGIN" always;
            }

            # For static assets (js, css, images): cache 1 year
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                add_header Cache-Control "public, max-age=31536000, immutable" always;
            }

            # Security headers
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # API proxy: forward /api/* to backend service
        location /api/ {
            set $backend_upstream http://api:8081;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 10s;

            # Preserve cookies from backend (important for sessions)
            proxy_cookie_path / /;
        }

        # Catch health check endpoints (for Traefik/Docker)
        location = /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        location = /healthz {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }
    }
}
